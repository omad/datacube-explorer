---
services:
  explorer:
    build:
      context: ..
      target: dev
    image: ghcr.io/opendatacube/explorer:dev
    volumes:
      - ..:/code
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    tty: true
    stdin_open: true
    depends_on:
      - postgres

  postgres:
    image: postgis/postgis:18-3.6
    hostname: postgres
    environment:
      - POSTGRES_DB=opendatacube
      - PGPORT=35433
      - POSTGRES_PASSWORD=opendatacubepassword
      - POSTG-USER=opendatacube
    ports:
      - "35433:35433"
    restart: always
    volumes:
      - ../.docker/create_db.sh:/docker-entrypoint-initdb.d/create-pg-databases.sh
      - type: tmpfs
        target: /var/lib/postgresql
    command: -c fsync=off -c full_page_writes=off -c synchronous_commit=off
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "postgres", "-q", "--port", "35433", "-d", "opendatacube", "-U", "opendatacube"]
      timeout: 45s
      interval: 10s
      retries: 10
